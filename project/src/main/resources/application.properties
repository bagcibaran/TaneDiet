spring.application.name=project
spring.jackson.deserialization.fail-on-unknown-properties=true

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/task_manager}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

task_serviceTwo_enable = false

spring.jpa.hibernate.ddl-auto=validate
# SQL'leri konsola basma (yerelde görmek için application-local.properties'e spring.jpa.show-sql=true yaz)
spring.jpa.show-sql=false

logging.level.com.project.project=INFO

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1